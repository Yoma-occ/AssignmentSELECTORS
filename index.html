<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css";> <!-- A link to the .css-->
    <title>CSS Selectors Assignment</title> <!-- Tab Title-->
</head>
<header id="header">This is the Header</header>  <!-- Mad an id selector-->

<body>
    <p>This is a paragraph with an <strong> # ID SELECTOR </strong></p> <!-- Utilized the <strong> tag to enable bold text-->
    <div>                                                               <!-- Made a <div> to nest a <p> inside to use pseudo class selector in styles.css-->
        <p>This is a paragraph is here to notify of the <em> unorderd</em> list below</p> <!-- Utilized <em> to italicize text -->
    </div>
    <ul>                                             <!-- Unordered List-->
        <li><strong> Item A </strong></li>
        <li><strong> Item B </strong></li>           <!-- List Items nested within the <ul> -->
        <li><strong> Item C </strong></li>
    </ul>
        <p> Below this paragraph is an <em> ordered</em> list </p>
    <ol>                                             <!-- Ordered List-->
        <strong><li class="item1"> Item</li></strong> <!-- Class selector made to single out the <ol> <li> child -->
        <strong><li> Item</li></strong>              <!-- List Items nested within the <ol> -->
        <strong><li> Item</li></strong>
    </ol>
    <strong><a href="https://example.com">Visit Example</a></strong>  <!-- <a> element hyperlink reference (CSS PURPOSES ONLY HERE)-->
</body>
</html>
